on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for NanoCode to excecute.'
        required: false
        default: "This is test."

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      content: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Set up git user
        run: |
          git config user.name "nano-code[bot]"
          git config user/email "nano-code[bot]@users.noreply.github.com"
      - name: Execute NanoCode
        run: bun run agent --yolo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ISSUE_BODY: ${{ inputs.task }}

